name: CodeReviewer.AI Automated Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Compile Java Code
        run: javac src/main/java/com/codereviewer/CodeReviewerBot.java

      - name: Run CodeReviewer Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: java -cp src/main/java com.codereviewer.CodeReviewerBot
